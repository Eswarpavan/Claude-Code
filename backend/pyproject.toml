[project]
name = "catalystedge"
version = "0.1.0"
description = "CatalystEdge: news-first positive swing-signal finder and $100 paper account"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.13",
  "celery[redis]>=5.4",
  "exchange-calendars>=4.5",
  "fastapi>=0.115",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "redis>=5.0",
  "sqlalchemy>=2.0.32",
  "structlog>=24.4",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# Installed on your machine / in the worker image, not in the build sandbox.
# The Docker image installs the CPU-only torch wheel of the pinned version.
ml = [
  "huggingface-hub>=0.24",
  "torch>=2.4",
  "transformers>=4.44",
]

[project.scripts]
catalystedge = "catalystedge.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["catalystedge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["db: needs a Postgres database (TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# SIM905 rewrites "a b c".split() into very long literal lists; keep word lists readable.
ignore = ["SIM905"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts Depends/Query calls in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
